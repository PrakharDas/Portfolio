  <rect x="544" y="402" width="300" height="212" rx="20" fill="#0f1630" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="860" y="402" width="300" height="212" rx="20" fill="#0f1630" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="154" y="248" fill="#e2e8f0" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700">Patient Bed 04</text>
  <text x="154" y="286" fill="#67e8f9" font-family="Inter, Arial, sans-serif" font-size="18">Flow: 32 ml/min · Status: Stable</text>
  <rect x="154" y="324" width="334" height="16" rx="8" fill="#1e293b"/>
