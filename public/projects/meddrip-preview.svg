<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MedDrip project preview</title>
  <desc id="desc">Dashboard preview for MedDrip intelligent saline monitoring system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072334"/>
      <stop offset="55%" stop-color="#101124"/>
      <stop offset="100%" stop-color="#2a1242"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="220" fill="#22d3ee" fill-opacity="0.18"/>
  <circle cx="170" cy="560" r="220" fill="#a855f7" fill-opacity="0.16"/>
  <rect x="84" y="64" width="1112" height="592" rx="34" fill="#0b1020" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="120" y="104" width="1040" height="50" rx="14" fill="#121938"/>
  <circle cx="152" cy="129" r="8" fill="#f87171"/>
  <circle cx="178" cy="129" r="8" fill="#fbbf24"/>
  <circle cx="204" cy="129" r="8" fill="#34d399"/>
