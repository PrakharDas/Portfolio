  <text x="580" y="456" fill="#e2e8f0" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="700">Critical Alerts</text>
  <text x="580" y="494" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Low level notifications delivered instantly to caregivers.</text>
  <text x="894" y="456" fill="#e2e8f0" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="700">Auto Flow Control</text>
  <text x="894" y="494" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Adjustments applied to maintain safe and consistent drip.</text>
