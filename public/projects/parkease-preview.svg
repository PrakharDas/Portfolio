<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ParkEase project preview</title>
  <desc id="desc">Smart parking dashboard preview for ParkEase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071b2e"/>
      <stop offset="100%" stop-color="#1a183e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="190" fill="#60a5fa" fill-opacity="0.18"/>
  <circle cx="160" cy="580" r="210" fill="#a78bfa" fill-opacity="0.16"/>
  <rect x="72" y="52" width="1136" height="616" rx="34" fill="#0d1328" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="116" y="112" fill="#e2e8f0" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="700">ParkEase Smart Parking</text>
  <text x="116" y="146" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="18">Live slot booking, occupancy status, and instant updates</text>
  <rect x="116" y="184" width="520" height="440" rx="24" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="664" y="184" width="500" height="200" rx="24" fill="#111b34" stroke="#22d3ee" stroke-opacity="0.35"/>
  <rect x="664" y="408" width="500" height="216" rx="24" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
  <g fill="#22d3ee" fill-opacity="0.2">
    <rect x="154" y="226" width="120" height="70" rx="14"/>
    <rect x="292" y="226" width="120" height="70" rx="14"/>
    <rect x="430" y="226" width="120" height="70" rx="14"/>
    <rect x="154" y="314" width="120" height="70" rx="14"/>
    <rect x="292" y="314" width="120" height="70" rx="14" fill="#34d399" fill-opacity="0.3"/>
    <rect x="430" y="314" width="120" height="70" rx="14"/>
    <rect x="154" y="402" width="120" height="70" rx="14" fill="#f87171" fill-opacity="0.35"/>
    <rect x="292" y="402" width="120" height="70" rx="14"/>
    <rect x="430" y="402" width="120" height="70" rx="14"/>
  </g>
  <text x="154" y="518" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Green: booked · Red: occupied · Blue: available</text>
  <text x="700" y="238" fill="#e2e8f0" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700">Live Occupancy Overview</text>
  <polyline points="700,320 760,300 820,318 880,274 940,286 1000,260 1060,276 1120,248" fill="none" stroke="#60a5fa" stroke-width="6"/>
  <text x="700" y="452" fill="#e2e8f0" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700">Instant Slot Updates</text>
  <text x="700" y="490" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Sensor-driven updates synced to app booking in real-time.</text>
</svg>
