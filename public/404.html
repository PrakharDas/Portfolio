<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Prakhar Das</title>
    <meta name="description" content="The page you are looking for was not found." />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.2), transparent 32%),
          radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.18), transparent 26%),
          linear-gradient(180deg, #060913 0%, #030712 100%);
        color: #e2e8f0;
      }
      .card {
        width: min(92vw, 660px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        padding: 2.6rem;
        box-shadow: 0 0 56px rgba(34, 211, 238, 0.14);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 0.9rem;
        line-height: 1.7;
        color: #cbd5e1;
      }
      .btn {
        display: inline-flex;
        margin-top: 1.4rem;
        border-radius: 14px;
        border: 1px solid rgba(103, 232, 249, 0.45);
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
        color: white;
        font-weight: 700;
        text-decoration: none;
        padding: 0.85rem 1.2rem;
      }
      .code {
        margin-top: 0.3rem;
        display: inline-block;
        font-size: 0.82rem;
        color: #67e8f9;
        letter-spacing: 0.24em;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="nf-title">
      <span class="code">ERROR 404</span>
      <h1 id="nf-title">Page not found</h1>
      <p>
        The page you requested does not exist or may have been moved.
        Return to the homepage to continue exploring Prakhar Das's portfolio.
      </p>
      <a class="btn" href="/">Back to Homepage</a>
    </main>
  </body>
</html>
